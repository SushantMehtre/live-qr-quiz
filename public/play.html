<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Join Live Quiz</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="aurora-bg"></div>

  <div class="play-shell">
    <!-- Top Mini Bar -->
    <div id="playHeader" class="glass-card" style="padding:12px 16px; border-radius:16px; display:none; align-items:center; justify-content:space-between;">
      <div style="display:flex; align-items:center; gap:10px;">
        <span id="myAvatarBadge" style="font-size:1.5rem;">🧠</span>
        <div>
          <div id="myNameBadge" style="font-weight:700; font-size:0.95rem;">Player</div>
          <div id="myRankBadge" style="font-size:0.78rem; color:var(--text-muted);">Rank #-</div>
        </div>
      </div>
      <div class="pill" style="padding:6px 12px;">
        <span id="myScoreBadge" style="color:#38bdf8; font-family:'Space Grotesk',sans-serif;">0 pts</span>
      </div>
    </div>

    <!-- 1. JOIN FORM -->
    <section id="playJoin" class="glass-card" style="padding:26px; margin-top:24px; display:flex; flex-direction:column; gap:16px;">
      <div style="text-align:center;">
        <div style="font-size:2.4rem; margin-bottom:6px;">⚡</div>
        <h1 style="font-family:'Space Grotesk',sans-serif; font-size:1.6rem;">Join Live Quiz</h1>
        <p style="color:var(--text-muted); font-size:0.88rem; margin-top:4px;">Enter your name to participate</p>
      </div>

      <div class="form-row">
        <label>Room PIN</label>
        <input type="text" id="inputPin" class="input-dark" inputmode="numeric" maxlength="6" placeholder="6-digit PIN" style="text-align:center; font-size:1.2rem; letter-spacing:0.15em; font-weight:700;" />
      </div>

      <div class="form-row">
        <label>Your Name</label>
        <input type="text" id="inputName" class="input-dark" maxlength="24" placeholder="e.g. Dr. Priya" />
      </div>

      <div class="form-row">
        <label>Pick an Avatar</label>
        <div class="avatar-grid" id="avatarGrid"></div>
      </div>

      <div id="joinError" style="color:#fda4af; font-size:0.86rem; display:none; text-align:center;"></div>

      <button class="btn btn-primary btn-lg" id="btnJoin" style="width:100%;">🚀 Join Quiz</button>
    </section>

    <!-- 2. WAITING LOBBY -->
    <section id="playWaiting" class="glass-card" style="padding:32px 22px; text-align:center; display:none; margin-top:20px;">
      <div style="font-size:3rem; margin-bottom:10px;" id="waitAvatar">🧠</div>
      <h2 style="font-family:'Space Grotesk',sans-serif; font-size:1.5rem;">You're in!</h2>
      <p style="color:var(--text-muted); margin-top:8px;">Keep an eye on the main screen. The quiz will begin shortly.</p>
    </section>

    <!-- 3. ACTIVE QUESTION -->
    <section id="playQuestion" style="display:none; flex-direction:column; gap:14px;">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <span class="pill" id="playQCounter">Q1 / 10</span>
        <span class="pill" id="playTimer" style="font-family:'Space Grotesk',sans-serif; color:#38bdf8;">30s</span>
      </div>

      <div class="glass-card" style="padding:18px; border-radius:18px;">
        <div id="playQText" style="font-weight:700; font-size:1.02rem; line-height:1.45; white-space:pre-line;"></div>
        <div id="playQImgWrap" style="margin-top:12px; display:none; text-align:center;">
          <img id="playQImg" style="max-width:100%; max-height:220px; border-radius:10px; object-fit:contain;" alt="Question" />
          <div style="font-size:0.72rem; color:var(--text-muted); margin-top:4px;">Tap image to zoom</div>
        </div>
      </div>

      <div class="play-options" id="playOptions"></div>

      <div id="playLockedMsg" class="glass-card" style="padding:14px; text-align:center; display:none; font-weight:700; color:#38bdf8;">
        🔒 Answer locked in! Waiting for results...
      </div>
    </section>

    <!-- 4. REVEAL / LEADERBOARD / FINISHED -->
    <section id="playResult" class="glass-card" style="padding:26px 20px; text-align:center; display:none; flex-direction:column; gap:14px;">
      <div id="resIcon" style="font-size:3rem;">🎉</div>
      <h2 id="resTitle" style="font-family:'Space Grotesk',sans-serif; font-size:1.6rem;">Correct!</h2>
      <p id="resSub" style="color:var(--text-muted); font-size:0.95rem;"></p>
      <div id="resStats" class="pill" style="margin:0 auto; font-size:1.05rem; padding:10px 18px;"></div>
      <div id="playMiniLb" style="display:flex; flex-direction:column; gap:8px; text-align:left; margin-top:8px;"></div>
    </section>
  </div>

  <!-- Lightbox -->
  <div class="lightbox" id="playLightbox">
    <img id="playLightboxImg" alt="Zoomed" />
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/play.js"></script>
</body>
</html>
